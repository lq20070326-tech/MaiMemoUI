# Project-wide Gradle settings.
# 说明：
# 1) AGP 9.2.1 下 configuration-cache 会出现序列化失败（packageDebugResources），
#    这里不开 configuration-cache，避免 Android Studio 反复 sync。
# 2) 本机内存偏紧（16G，常同时开 AS / Rider / Trae），守护进程堆保持 2g，
#    且不开 parallel，避免和 IDE 抢内存导致卡死。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8